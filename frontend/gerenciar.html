<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar Escala — MilScale</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="faixa">
    <div class="faixa-interna">
      <span class="marca">MilScale</span>
      <span class="unidade">1º Batalhão de Infantaria</span>
      <nav class="menu">
        <a href="escala.html">Escala</a>
        <a href="dashboard.html">Indicadores</a>
        <a class="ativo" href="gerenciar.html">Gerenciar</a>
      </nav>
    </div>
  </header>

  <main>
    <p class="rotulo">CRUD · MongoDB Atlas</p>
    <h1>Gerenciar Escala</h1>
    <p class="chamada">
      As quatro operações da escala, cada uma em sua Azure Function, gravando na
      coleção <code>escala</code> do MongoDB Atlas.
    </p>

    <form id="formulario" class="formulario" autocomplete="off">
      <h2 id="tituloFormulario">Incluir serviço</h2>

      <div class="campos">
        <div class="campo">
          <label for="posto">Posto / Graduação</label>
          <input id="posto" maxlength="12" placeholder="1º TEN" required>
        </div>
        <div class="campo">
          <label for="nome">Nome de guerra</label>
          <input id="nome" maxlength="40" placeholder="ANDRADE" required>
        </div>
        <div class="campo">
          <label for="circulo">Círculo</label>
          <select id="circulo" required>
            <option value="oficial">Oficial</option>
            <option value="sargento">Sargento</option>
            <option value="praca">Praça</option>
          </select>
        </div>
        <div class="campo">
          <label for="funcao">Função de serviço</label>
          <input id="funcao" maxlength="40" placeholder="Oficial de Dia" required>
        </div>
        <div class="campo">
          <label for="data">Data</label>
          <input id="data" type="date" required>
        </div>
        <div class="campo">
          <label for="subunidade">Subunidade</label>
          <input id="subunidade" maxlength="30" placeholder="1ª Cia Fuz" required>
        </div>
      </div>

      <div class="acoes-formulario">
        <button type="submit" id="botaoSalvar" class="botao">Incluir na escala</button>
        <button type="button" id="botaoCancelar" class="botao botao-secundario" hidden>Cancelar edição</button>
      </div>
    </form>

    <form id="formularioBusca" class="busca" autocomplete="off">
      <input id="termo" placeholder="Buscar por posto, nome, função ou subunidade">
      <button type="submit" class="botao">Pesquisar</button>
      <button type="button" id="botaoLimpar" class="botao botao-secundario">Ver todos</button>
    </form>

    <div id="feedback"></div>
    <div id="conteudo"></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/gerenciar.js"></script>
</body>
</html>
